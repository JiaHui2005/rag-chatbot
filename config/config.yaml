app:
  name: "RAG AI Assistant"
  version: "1.0.0"

rag:
  chunk_size: 1000
  chunk_overlap: 200
  vector_store: "chroma"
  embedding_backend: "simple"
  embedding_model: "all-MiniLM-L6-v2"
  persist_dir: "db/chroma"
  collection_name: "land_law_rag"
  chunks_path: "data/processed/merged_chunks.jsonl"
  vector_k: 8
  bm25_k: 8
  final_k: 5
  max_chars_per_doc: 1800
  min_high_confidence_docs: 2
  use_extractive_answer: true
  max_extractive_bullets: 12

llm:
  provider: "openai"
  model: "gpt-3.5-turbo"
  temperature: 0.7
